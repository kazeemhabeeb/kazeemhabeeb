<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <title>Login - TrustFeed</title>
        <link href="css/styles.css" rel="stylesheet" />
        <link href="../proto.css" rel="stylesheet" />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/js/all.min.js"></script>
    </head>
    <body class="bg-primary">
        <div id="layoutAuthentication">
            <div id="layoutAuthentication_content">
                <main>
                    <div class="container">
                        <div class="row justify-content-center">
                            <div class="col-lg-5">
                                <div class="card shadow-lg border-0 rounded-lg mt-5">
                                    <div class="card-header"><h3 class="text-center font-weight-light my-4">TrustFeed Admin Login</h3></div>
                                    <div class="card-body">
                                        <form action="dashboard.html">
                                            <div class="form-floating mb-3">
                                                <input class="form-control" id="inputUsername" type="text" placeholder="Username" value="habeeb" />
                                                <label for="inputUsername">Username</label>
                                            </div>
                                            <div class="form-floating mb-3">
                                                <input class="form-control" id="inputPassword" type="password" placeholder="Password" value="password" />
                                                <label for="inputPassword">Password</label>
                                            </div>
                                            <div class="d-flex align-items-center justify-content-end mt-4 mb-0">
                                                <a class="btn btn-primary" href="dashboard.html">Login</a>
                                            </div>
                                        </form>
                                    </div>
                                    <div class="card-footer text-center py-3">
                                        <div class="small"><span class="req">[FR-3.1 secure password-protected portal]</span> <span class="req">[NFR-1.2 bcrypt, secure session, automatic timeout]</span></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
            <div id="layoutAuthentication_footer">
                <footer class="py-4 bg-light mt-auto">
                    <div class="container-fluid px-4">
                        <div class="d-flex align-items-center justify-content-between small">
                            <div class="text-muted">Copyright &copy; TrustFeed 2026</div>
                        </div>
                    </div>
                </footer>
            </div>
        </div>
        <div class="proto-bar" role="navigation" aria-label="Prototype screens">
            <strong>Prototype</strong> <span class="grp">Public:</span> <a href="../public/index.html">News feed</a> <a href="../public/article.html">Article details</a> <span class="grp">Admin:</span> <a href="../admin/login.html" class="on">Login</a> <a href="../admin/dashboard.html">Dashboard</a> <a href="../admin/sources.html">RSS sources</a> <a href="../admin/articles.html">Articles</a> <a href="../admin/logs.html">System logs</a>
            <label for="reqToggle"><input type="checkbox" id="reqToggle" checked /> Show proposal references</label>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/scripts.js"></script>
        <script src="../proto.js"></script>
    </body>
</html>
