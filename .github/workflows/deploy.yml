# Deploy TrustFeed to Hostinger whenever the main branch changes (or when started by hand from the
# Actions tab). Only the app's own files are uploaded, over SSH with rsync:
#   app/public_html/  ->  <DEPLOY_PATH>/public_html/   (the website)
#   app/includes, cron, tools, database, config/config.example.php  ->  <DEPLOY_PATH>/...   (private, outside the web folder)
# config/config.php (passwords and API key) is created once on the server and is never uploaded or deleted.
#
# Repository secrets needed (GitHub: Settings -> Secrets and variables -> Actions):
#   SSH_HOST         the server IP shown in hPanel -> Advanced -> SSH Access
#   SSH_PORT         the SSH port shown there (Hostinger uses 65002)
#   SSH_USER         the SSH username shown there (u...)
#   SSH_PRIVATE_KEY  the private half of the key whose public half is added in hPanel SSH Access
#   DEPLOY_PATH      the folder that contains the site's public_html, e.g. /home/u123/domains/trustfeed.example.com

name: Deploy to Hostinger

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the PHP files before uploading
        run: find app -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Set up the SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload the app
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          RSH="ssh -i $HOME/.ssh/deploy_key -p $SSH_PORT"
          DEST="$SSH_USER@$SSH_HOST:$DEPLOY_PATH"
          # The website. -c compares file contents, so only changed files are sent; --delete removes files
          # we deleted from the project; Hostinger's SSL folder (.well-known) is kept.
          rsync -rlzc --delete --exclude '.well-known/' -e "$RSH" app/public_html/ "$DEST/public_html/"
          # Private folders, outside public_html (§3.8).
          for dir in includes cron tools database; do
            rsync -rlzc --delete -e "$RSH" "app/$dir/" "$DEST/$dir/"
          done
          # Config folder: only the template and its .htaccess. config.php on the server is left alone.
          rsync -rlzc -e "$RSH" app/config/config.example.php app/config/.htaccess "$DEST/config/"
          echo "Deployed commit $GITHUB_SHA"
