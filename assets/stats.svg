<svg xmlns="http://www.w3.org/2000/svg" width="420" height="200" viewBox="0 0 420 200" role="img" aria-label="GitHub stats for Kazeem Habeeb">
  <style>
    :root { --bg:#ffffff; --border:#d0d7de; --fg:#1f2328; --dim:#656d76; --accent:#777BB4; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --border:#30363d; --fg:#e6edf3; --dim:#8b949e; --accent:#a5a8e6; }
    }
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: var(--fg); }
    .title { font-size: 15px; font-weight: 700; }
    .num { font-size: 22px; font-weight: 700; fill: var(--accent); }
    .label { font-size: 11px; }
    .dim { fill: var(--dim); }
    .fade { opacity: 0; animation: fade .6s ease-out forwards; }
    .grow { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow .8s ease-out forwards; }
    @keyframes fade { to { opacity: 1; } }
    @keyframes grow { to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) { .fade, .grow { animation: none; opacity: 1; transform: none; } }
  </style>
  <rect x="0.5" y="0.5" width="419" height="199" rx="10" fill="var(--bg)" stroke="var(--border)"/>
  <text class="title" x="24" y="32">Kazeem Habeeb's GitHub</text>
  <text class="label dim" x="396" y="32" text-anchor="end">coding since 2021</text>
  <g class="fade" style="animation-delay:0s" transform="translate(24 64)">
    <text class="num" y="0">0</text>
    <text class="label" y="20">Repos</text>
  </g>
  <g class="fade" style="animation-delay:0.15s" transform="translate(122 64)">
    <text class="num" y="0">0</text>
    <text class="label" y="20">Stars</text>
  </g>
  <g class="fade" style="animation-delay:0.3s" transform="translate(220 64)">
    <text class="num" y="0">0</text>
    <text class="label" y="20">Forks</text>
  </g>
  <g class="fade" style="animation-delay:0.45s" transform="translate(318 64)">
    <text class="num" y="0">0</text>
    <text class="label" y="20">Followers</text>
  </g>

  <clipPath id="bar"><rect x="24" y="118" width="372" height="8" rx="4"/></clipPath>
  <rect x="24" y="118" width="372" height="8" rx="4" fill="var(--border)"/>
  <g clip-path="url(#bar)">
  </g>
<text class="label" x="24" y="148">No languages yet. Push some code!</text>
  <text class="label dim" x="396" y="188" text-anchor="end" font-size="9">updated Oct 7, 2026</text>
</svg>
